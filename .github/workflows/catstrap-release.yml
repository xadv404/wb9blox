name: Release Catstrap

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content .\Bloxstrap\Bloxstrap.csproj
          $version = $project.Project.PropertyGroup.Version
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Check if release needed
        id: check
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          git fetch --tags --force
          $existingTag = [string](git tag -l $tag)
          if (-not [string]::IsNullOrWhiteSpace($existingTag)) {
            "skip=true" >> $env:GITHUB_OUTPUT
            Write-Host "Tag $tag already exists - skipping release (bump Version in Bloxstrap.csproj to publish)."
          } else {
            "skip=false" >> $env:GITHUB_OUTPUT
          }

      - name: Prepare release notes
        id: notes
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $version = "${{ steps.version.outputs.version }}"

          $prevTag = git tag -l 'v*' --sort=-v:refname |
            Where-Object { $_ -ne $tag } |
            Select-Object -First 1

          if ($prevTag) {
            $range = "$prevTag..HEAD"
            $compareUrl = "https://github.com/${{ github.repository }}/compare/${prevTag}...${tag}"
          } else {
            $range = "HEAD"
            $compareUrl = "https://github.com/${{ github.repository }}/releases/tag/${tag}"
          }

          $subjects = git log $range --pretty=format:"%s" --no-merges --reverse
          $lines = @()
          foreach ($subject in $subjects) {
            if ([string]::IsNullOrWhiteSpace($subject)) { continue }
            $clean = $subject -replace '\s*\(v[\d.]+\)\s*$', ''
            if ($clean -match '^(Merge|Bump version)') { continue }
            $lines += "- $clean"
          }

          if ($lines.Count -eq 0) {
            $lines = @("- Mise à jour de maintenance")
          }

          $body = @(
            "## Catstrap v$version",
            "",
            "### Modifications",
            "",
            ($lines -join "`n"),
            "",
            "### Détails",
            "",
            "- **Version précédente :** $(if ($prevTag) { $prevTag } else { 'première release' })",
            "- **Commit :** ``${{ github.sha }}``",
            "- **Comparer :** $compareUrl"
          ) -join "`n"

          $body | Out-File -FilePath release-notes.md -Encoding utf8NoBOM
          "path=release-notes.md" >> $env:GITHUB_OUTPUT

      - name: Restore
        if: steps.check.outputs.skip != 'true'
        run: dotnet restore

      - name: Publish
        if: steps.check.outputs.skip != 'true'
        run: dotnet publish .\Bloxstrap\Bloxstrap.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:CommitHash=${{ github.sha }} -p:CommitRef=tag/${{ steps.version.outputs.tag }}

      - name: Create GitHub Release
        if: steps.check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Catstrap ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          files: .\Bloxstrap\bin\Release\net6.0-windows\win-x64\publish\Catstrap.exe
          draft: false
          make_latest: true
          overwrite_files: true
